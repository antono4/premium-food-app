            'shrimp-tempura': {
                id: 'shrimp-tempura', title: 'Shrimp Tempura', price: 16.00, rating: 4.8, calories: 420, time: 20,
                image: 'https://images.unsplash.com/photo-1615361200141-f45040f367be?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                description: 'Udang jumbo dengan lapisan tempura renyah.',
                category: 's', categoryName: 'Seafood', tags: ['Renyah'], isPopular: true
            }
        };

        const categoryNames = { v: 'Vegan', m: 'Daging', s: 'Seafood', d: 'Minuman', all: 'Semua' };

        // ==================== STATE ====================
        let cart = [];
        let favorites = [];
        let currentDetailItem = null;
        let quantity = 1;
        let recentSearches = [];
        let deliveryFee = 0;
        let discount = 0;
        let previousScreen = 'screen-home';
        let isFavorite = false;

        // ==================== LOCAL STORAGE ====================
        function saveToStorage() {
            localStorage.setItem('trumada_cart', JSON.stringify(cart));
            localStorage.setItem('trumada_favorites', JSON.stringify(favorites));
            localStorage.setItem('trumada_recent_searches', JSON.stringify(recentSearches));
        }

        function loadFromStorage() {
            try {
                const savedCart = localStorage.getItem('trumada_cart');
                const savedFavorites = localStorage.getItem('trumada_favorites');
                const savedSearches = localStorage.getItem('trumada_recent_searches');
                if (savedCart) cart = JSON.parse(savedCart);
                if (savedFavorites) favorites = JSON.parse(savedFavorites);
                if (savedSearches) recentSearches = JSON.parse(savedSearches);
            } catch (e) { console.warn('Error loading from storage:', e); }
        }

        // ==================== NAVIGATION ====================
        function navigateTo(screenId) {
            previousScreen = document.querySelector('.screen.active')?.id || 'screen-home';
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) {
                target.classList.add('active', 'screen-enter');
                target.scrollTop = 0;
                if (screenId === 'screen-cart') renderCart();
                if (screenId === 'screen-search') { renderSearchResults(); renderRecentSearches(); }
                if (screenId === 'screen-favorites') renderFavorites();
                if (screenId === 'screen-home') renderHomeMenu();
            }
        }

        function navigateBack() { navigateTo(previousScreen); }

        // ==================== HOME MENU ====================
        function renderHomeMenu() {
            const container = document.getElementById('home-menu-list');
            if (!container) return;
            const popularItems = Object.values(menuItems).filter(item => item.isPopular);
            container.innerHTML = popularItems.map(item => `
                <div class="menu-item bg-cardBg p-4 rounded-2xl flex items-center gap-4 cursor-pointer" onclick="openDetail('${item.id}')">
                    <div class="relative">
                        <img src="${item.image}" alt="${item.title}" class="w-20 h-20 rounded-2xl object-cover">
                        ${item.isPopular ? '<span class="absolute -top-2 -right-2 bg-warning text-black text-[8px] font-bold px-1.5 py-0.5 rounded-full"><i class="fa-solid fa-fire"></i></span>' : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h5 class="font-semibold text-sm truncate">${item.title}</h5>
                        <p class="text-textMuted text-xs mt-0.5 line-clamp-1">${item.description}</p>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="flex items-center gap-0.5 text-xs"><i class="fa-solid fa-star text-yellow-400"></i>${item.rating}</span>
                            <span class="text-textMuted text-xs">•</span>
                            <span class="text-textMuted text-xs flex items-center gap-0.5"><i class="fa-solid fa-fire text-red-400"></i>${item.calories} kcal</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <span class="text-skyBlue font-bold">$${item.price.toFixed(2)}</span>
                        <button onclick="event.stopPropagation(); addToCart('${item.id}')" class="w-8 h-8 bg-skyBlue rounded-lg flex items-center justify-center btn-press hover:bg-skyBlueDark">
                            <i class="fa-solid fa-plus text-black text-sm"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ==================== FAVORITES ====================
        function updateFavoritesBadge() {
            const count = favorites.length;
            ['favorites-badge', 'favorites-badge-nav'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.textContent = count; el.classList.toggle('hidden', count === 0); }
            });
        }

        function renderFavorites() {
            const emptyState = document.getElementById('favorites-empty');
            const listContainer = document.getElementById('favorites-list');
            if (favorites.length === 0) {
                emptyState.classList.remove('hidden');
                listContainer.classList.add('hidden');
                return;
            }
            emptyState.classList.add('hidden');
            listContainer.classList.remove('hidden');
            const favItems = favorites.map(id => menuItems[id]).filter(Boolean);
            listContainer.innerHTML = favItems.map(item => `
                <div class="menu-item bg-cardBg p-4 rounded-2xl flex items-center gap-4 cursor-pointer" onclick="openDetail('${item.id}')">
                    <img src="${item.image}" alt="${item.title}" class="w-20 h-20 rounded-2xl object-cover">
                    <div class="flex-1 min-w-0">
                        <h5 class="font-semibold text-sm truncate">${item.title}</h5>
                        <p class="text-textMuted text-xs mt-0.5 line-clamp-1">${item.description}</p>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="flex items-center gap-0.5 text-xs"><i class="fa-solid fa-star text-yellow-400"></i>${item.rating}</span>
                            <span class="text-textMuted text-xs">•</span>
                            <span class="text-textMuted text-xs">${item.calories} kcal</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <span class="text-skyBlue font-bold">$${item.price.toFixed(2)}</span>
                        <button onclick="event.stopPropagation(); removeFavorite('${item.id}')" class="w-8 h-8 bg-danger/20 rounded-lg flex items-center justify-center btn-press hover:bg-danger/30">
                            <i class="fa-solid fa-trash text-danger text-sm"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            updateFavoritesBadge();
        }

        function removeFavorite(itemId) {
            favorites = favorites.filter(id => id !== itemId);
            updateFavoritesBadge();
            renderFavorites();
            saveToStorage();
            showToast('Dihapus dari favorit', 'error');
        }

        // ==================== RECENT SEARCHES ====================
        function renderRecentSearches() {
            const container = document.getElementById('recent-searches');
            const listContainer = document.getElementById('recent-search-list');
            if (recentSearches.length === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            listContainer.innerHTML = recentSearches.map(term => `
                <button onclick="searchFromRecent('${term}')" class="flex items-center gap-2 bg-cardBg px-3 py-2 rounded-full text-sm text-textMuted hover:text-white hover:bg-cardHover transition-colors">
                    <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                    <span>${term}</span>
                </button>
            `).join('');
        }

        function searchFromRecent(term) {
            const input = document.getElementById('search-input');
            if (input) { input.value = term; renderSearchResults(document.querySelector('.search-cat.active')?.dataset.category || 'all', term); }
        }

        function clearRecentSearches() {
            recentSearches = [];
            saveToStorage();
            renderRecentSearches();
        }

        // ==================== DETAIL ====================
        function openDetail(itemId) {
            currentDetailItem = menuItems[itemId];
            quantity = 1; isFavorite = false;
            if (currentDetailItem) {
                document.getElementById('detail-title').textContent = currentDetailItem.title;
                document.getElementById('detail-price').textContent = `$${currentDetailItem.price.toFixed(2)}`;
                document.getElementById('detail-image').src = currentDetailItem.image;
                document.getElementById('detail-rating').textContent = currentDetailItem.rating;
                document.getElementById('detail-calories').textContent = currentDetailItem.calories;
                document.getElementById('detail-description').textContent = currentDetailItem.description;
                document.getElementById('qty-value').textContent = '1';
                updateDetailPrice();
                document.getElementById('detail-favorite').innerHTML = '<i class="fa-regular fa-heart"></i>';
            }
            navigateTo('screen-detail');
        }

        function changeQuantity(delta) {
            quantity = Math.max(1, quantity + delta);
            document.getElementById('qty-value').textContent = quantity;
            updateDetailPrice();
            const minusBtn = document.getElementById('qty-minus');
            minusBtn.className = quantity <= 1 
                ? 'qty-btn w-9 h-9 rounded-xl bg-darkBg flex items-center justify-center textMuted opacity-50'
                : 'qty-btn w-9 h-9 rounded-xl bg-darkBg flex items-center justify-center text-primary';
        }

        function updateDetailPrice() {
            if (currentDetailItem) {
                const total = currentDetailItem.price * quantity;
                document.getElementById('detail-total-price').textContent = `$${total.toFixed(2)}`;
            }
        }

        function toggleFavorite() {
            if (!currentDetailItem) return;
            isFavorite = !isFavorite;
            const btn = document.getElementById('detail-favorite');
            btn.innerHTML = isFavorite ? '<i class="fa-solid fa-heart text-danger"></i>' : '<i class="fa-regular fa-heart"></i>';
            
            if (isFavorite) {
                if (!favorites.includes(currentDetailItem.id)) favorites.push(currentDetailItem.id);
                showToast('Ditambahkan ke favorit', 'success');
            } else {
                favorites = favorites.filter(id => id !== currentDetailItem.id);
                showToast('Dihapus dari favorit', 'error');
            }
            updateFavoritesBadge();
            saveToStorage();
        }

        // ==================== CART ====================
        function addToCart(itemId) {
            const item = menuItems[itemId];
            if (!item) return;
            const existing = cart.find(c => c.id === itemId);
            if (existing) { existing.qty += 1; showToast(`${item.title} +1`, 'success'); }
            else { cart.push({ ...item, qty: 1 }); showToast(`${item.title} ditambahkan`, 'success'); }
            updateCartBadge();
            saveToStorage();
        }

        function addToCartFromDetail() {
            if (!currentDetailItem) return;
            const existing = cart.find(c => c.id === currentDetailItem.id);
            if (existing) existing.qty += quantity;
            else cart.push({ ...currentDetailItem, qty: quantity });
            updateCartBadge();
            saveToStorage();
            showToast(`${currentDetailItem.title} ditambahkan ke keranjang`, 'success');
            setTimeout(() => navigateTo('screen-cart'), 500);
        }

        function removeFromCart(itemId) {
            cart = cart.filter(c => c.id !== itemId);
            updateCartBadge();
            renderCart();
            saveToStorage();
        }

        function updateCartItemQty(itemId, delta) {
            const item = cart.find(c => c.id === itemId);
            if (item) { item.qty = Math.max(1, item.qty + delta); renderCart(); saveToStorage(); }
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (confirm('Hapus semua item dari keranjang?')) { cart = []; updateCartBadge(); renderCart(); saveToStorage(); showToast('Keranjang dikosongkan', 'error'); }
        }

        function updateCartBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            ['cart-badge-home', 'cart-badge-nav', 'cart-badge-search', 'cart-badge-fav'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.textContent = total; el.classList.toggle('hidden', total === 0); }
            });
        }

        function renderCart() {
            const emptyState = document.getElementById('cart-empty');
            const cartList = document.getElementById('cart-list');
            const summary = document.getElementById('cart-summary');
            
            if (cart.length === 0) {
                emptyState.classList.remove('hidden');
                cartList.classList.add('hidden');
                summary.classList.add('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            cartList.classList.remove('hidden');
            summary.classList.remove('hidden');
            
            cartList.innerHTML = cart.map(item => `
                <div class="bg-cardBg p-4 rounded-2xl flex items-center gap-4">
                    <img src="${item.image}" alt="${item.title}" class="w-20 h-20 rounded-2xl object-cover">
                    <div class="flex-1 min-w-0">
                        <h5 class="font-semibold text-sm truncate">${item.title}</h5>
                        <p class="text-skyLight text-sm font-medium mt-0.5">$${(item.price * item.qty).toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-2 bg-darkBg rounded-xl p-1">
                        <button onclick="updateCartItemQty('${item.id}', -1)" class="w-7 h-7 rounded-lg flex items-center justify-center textMuted hover:text-primary">
                            <i class="fa-solid fa-minus text-xs"></i>
                        </button>
                        <span class="font-medium text-sm w-5 text-center">${item.qty}</span>
                        <button onclick="updateCartItemQty('${item.id}', 1)" class="w-7 h-7 rounded-lg flex items-center justify-center bg-skyLight text-darkBg">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('cart-total').textContent = `$${subtotal.toFixed(2)}`;
        }

        function checkout() {
            if (cart.length === 0) return;
            const modal = document.getElementById('checkout-success');
            const eta = document.getElementById('eta-time');
            if (modal && eta) {
                eta.textContent = deliveryFee > 0 ? '15-20 menit' : '30-45 menit';
                modal.classList.remove('hidden');
            }
            cart = [];
            updateCartBadge();
            saveToStorage();
        }

        function closeCheckoutSuccess() {
            const modal = document.getElementById('checkout-success');
            if (modal) modal.classList.add('hidden');
            navigateTo('screen-home');
            showToast('Terima kasih! Pesananmu sedang dibuat 🎉', 'success');
        }

        // ==================== SEARCH ====================
        function renderSearchResults(category = 'all', query = '') {
            const container = document.getElementById('search-results');
            const countEl = document.getElementById('search-results-count');
            let items = Object.values(menuItems);
            if (category !== 'all') items = items.filter(item => item.category === category);
            if (query) {
                const q = query.toLowerCase();
                items = items.filter(item => item.title.toLowerCase().includes(q) || item.description.toLowerCase().includes(q));
            }
            countEl.textContent = query ? `Ditemukan ${items.length} hasil untuk "${query}"` : `Menampilkan ${items.length} menu`;
            
            container.innerHTML = items.map(item => `
                <div class="bg-cardBg rounded-3xl p-4 cursor-pointer menu-item" onclick="openDetail('${item.id}')">
                    <div class="relative -mt-4 mb-3">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-32 object-cover rounded-2xl">
                        <span class="absolute top-2 right-2 bg-skyDark/70 text-primary text-[10px] px-2 py-1 rounded-lg flex items-center">
                            <i class="fa-solid fa-star text-skyLight mr-1 text-xs"></i>${item.rating}
                        </span>
                    </div>
                    <h5 class="font-semibold text-sm mb-1">${item.title}</h5>
                    <div class="flex justify-between items-center">
                        <span class="text-skyLight font-bold">$${item.price.toFixed(2)}</span>
                        <button onclick="event.stopPropagation(); addToCart('${item.id}')" class="w-8 h-8 bg-skyLight rounded-lg flex items-center justify-center btn-press">
                            <i class="fa-solid fa-plus text-darkBg text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ==================== TOAST ====================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = toast.querySelector('i');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('success', 'error');
            toast.classList.add(type);
            if (type === 'success') icon.className = 'fa-solid fa-check-circle text-success';
            else if (type === 'error') icon.className = 'fa-solid fa-times-circle text-danger';
            else icon.className = 'fa-solid fa-info-circle text-skyBlue';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            updateCartBadge();
            updateFavoritesBadge();
            renderHomeMenu();
            renderSearchResults();
            
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const activeCat = document.querySelector('.search-cat.active');
                    renderSearchResults(activeCat ? activeCat.dataset.category : 'all', e.target.value);
                });
            }
            
            document.querySelectorAll('.search-cat').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.search-cat').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const query = searchInput?.value || '';
                    renderSearchResults(btn.dataset.category, query);
                    if (query && !recentSearches.includes(query)) {
                        recentSearches.unshift(query);
                        if (recentSearches.length > 5) recentSearches.pop();
                        saveToStorage();
                        renderRecentSearches();
                    }
                });
            });
            
            document.querySelectorAll('.category-pill:not(.search-cat)').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-pill:not(.search-cat)').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
